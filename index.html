<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Темп</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ac:#2CEFB0;
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#E3E7EE; --text:#101418; --muted:#6F7884; --line:rgba(16,20,24,.10);
  --mint:#2CEFB0; --mint-ink:#06311F; --shadow:0 10px 30px -18px rgba(16,20,24,.45);
  --r0:#9AA3AE; --r1:#22CC84; --r2:#3D9BFF; --r3:#A35CFF; --r4:#FF9F1C;
  --eff:#FF9F1C; --luck:#3D9BFF; --comf:#22CC84;
  --font:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1419; --surface:#1A2129; --surface-2:#252E39; --text:#F1F4F8; --muted:#8C97A5; --line:rgba(255,255,255,.09); --shadow:0 10px 30px -18px rgba(0,0,0,.9); }
}
:root[data-theme="dark"]{ --bg:#0F1419; --surface:#1A2129; --surface-2:#252E39; --text:#F1F4F8; --muted:#8C97A5; --line:rgba(255,255,255,.09); --shadow:0 10px 30px -18px rgba(0,0,0,.9); }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;font-weight:500;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background-color .45s}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.shell{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}

/* top bar */
.top{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px 4px}
.ava{width:42px;height:42px;border-radius:15px;background:var(--text);color:var(--ac);display:grid;place-items:center;font-weight:900;font-size:17px;flex:0 0 auto;transition:color .45s}
.who{min-width:0}
.who b{display:block;font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--muted);font-weight:600}
.wallet{margin-left:auto;display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;background:var(--surface);border-radius:99px;padding:6px 10px 6px 7px;font-weight:800;font-size:13.5px;box-shadow:var(--shadow);white-space:nowrap}
.pill .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#FFE14D;color:#4A3500}
.coin{width:20px;height:20px;flex:0 0 auto}
.gear-btn{width:38px;height:38px;border-radius:13px;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.gear-btn svg{width:18px;height:18px}
.dotsbar{display:flex;gap:5px;justify-content:center;padding:6px 0 6px;flex:0 0 auto}
.dotsbar i{width:6px;height:6px;border-radius:9px;background:var(--line);transition:width .25s,background .25s}
.dotsbar i.on{width:20px;background:var(--text)}
.dotsbar i.home,.dotsbar i.rew{border-radius:3px}

/* pages */
.pages{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;padding:4px 16px 130px;scrollbar-width:none;overscroll-behavior-y:contain}
.page::-webkit-scrollbar{display:none}
.h2{font-weight:900;font-size:19px;margin:16px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.h2 small{font-size:12px;color:var(--muted);font-weight:700}

/* energy */
.energy{background:var(--surface);border-radius:22px;padding:12px 14px;box-shadow:var(--shadow)}
.energy-row{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13px}
.energy-row span{color:var(--muted);font-weight:600}
.cells{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:9px}
.cells i{height:11px;border-radius:4px;background:var(--surface-2)}
.cells i.on{background:linear-gradient(180deg,#FFE96E,#FFC21A);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}

/* overview cards */
.ov{background:var(--surface);border-radius:22px;padding:12px 12px 12px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent}
.ov-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ov-head .em{font-size:20px}
.ov-head b{font-weight:900;font-size:15.5px}
.ov-head .lv{margin-left:auto;font-size:12px;font-weight:800;color:var(--rc)}
.ov-head .chev{color:var(--muted);font-size:18px;font-weight:900;margin-left:4px}
.th-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.th{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center}
.th img,.th svg{width:100%;height:100%;object-fit:cover;display:block}
.th.locked img,.th.locked svg{filter:grayscale(.6) brightness(.7);opacity:.75}
.th.now{outline:3px solid var(--rc);outline-offset:-3px}
.th .lk{position:absolute;inset:auto 0 0 0;font-size:9.5px;font-weight:800;text-align:center;padding:2px 0;background:rgba(0,0,0,.55);color:#fff}
.th.now .lk{background:var(--rc)}
.th-name{font-size:10px;font-weight:700;color:var(--muted);text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-bar{height:6px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.ov-bar i{display:block;height:100%;background:var(--rc);border-radius:inherit}
.hint{color:var(--muted);font-size:12.5px;font-weight:600;text-align:center;margin:6px 0 2px}

/* area page */
.a-head{display:flex;align-items:center;gap:10px;margin:6px 2px 10px}
.a-head .em{font-size:30px;line-height:1}
.a-head .nm{font-weight:900;font-size:24px;letter-spacing:-.01em;line-height:1.05}
.a-head .sub{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.rar{color:#fff;font-weight:800;font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--rc)}
.stars{display:inline-flex;gap:1px;font-size:13px;line-height:1}
.stars i{font-style:normal;color:var(--line)}
.stars i.on{color:var(--rc)}
.a-head .lvbig{margin-left:auto;text-align:right}
.a-head .lvbig b{font-weight:900;font-size:26px;line-height:1}
.a-head .lvbig small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.xpbar{height:14px;border-radius:8px;background:var(--surface-2);overflow:hidden;position:relative;margin:0 0 12px}
.xpbar i{display:block;height:100%;border-radius:inherit;background:var(--ac);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.xpbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:var(--text)}
[data-tier="0"]{--st:#AEB6C2;--rc:#9AA3AE;--rays:0}
[data-tier="1"]{--st:#22CC84;--rc:#22CC84;--rays:0}
[data-tier="2"]{--st:#3D9BFF;--rc:#3D9BFF;--rays:.6}
[data-tier="3"]{--st:#A35CFF;--rc:#A35CFF;--rays:1}
[data-tier="4"]{--st:#FF9F1C;--rc:#FF9F1C;--rays:1}
.stage{position:relative;height:200px;border-radius:22px;overflow:hidden;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(120% 90% at 50% 30%,color-mix(in srgb,var(--st) 38%,#0B0E16) 0%,#0B0E16 70%);box-shadow:var(--shadow)}
.stage.flat{background:linear-gradient(180deg,color-mix(in srgb,var(--st) 24%,var(--surface)),color-mix(in srgb,var(--st) 6%,var(--surface)))}
.stage .item{width:200px}
.stage .item svg{width:100%;height:auto;display:block}
.c3d{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:pan-x pan-y;cursor:grab}
.coll-card .c3d{touch-action:pan-y}
.stage .scan{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.35;background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(255,255,255,.045) 3px 4px)}
.stage .hud{position:absolute;left:10px;bottom:8px;z-index:3;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--st);opacity:.9;pointer-events:none}
.stage .hud2{position:absolute;right:10px;top:8px;z-index:3;font-size:10px;font-weight:800;color:var(--st);opacity:.8;pointer-events:none}
.stage .hud3{position:absolute;right:10px;bottom:8px;z-index:3;font-size:10px;font-weight:800;color:#fff;opacity:.6;pointer-events:none}
.itemname{display:flex;justify-content:space-between;align-items:baseline;margin:10px 2px 4px;font-size:13px;color:var(--muted);font-weight:600}
.itemname b{color:var(--rc);font-weight:900;font-size:15px}
.attrs{display:grid;gap:7px;background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.attr{display:grid;grid-template-columns:118px 1fr 28px;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.attr .b{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.attr .b i{display:block;height:100%;border-radius:inherit;background:var(--c)}
.attr em{font-style:normal;text-align:right;font-weight:900}

/* tasks */
.t-group{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:14px 4px 6px}
.task{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:20px;padding:11px 8px 11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.t-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 22%,var(--surface));flex:0 0 auto}
.t-body{flex:1;min-width:0;cursor:pointer}
.t-title{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.t-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{font-size:11px;font-weight:800;padding:3px 7px;border-radius:8px;background:var(--surface-2);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.tag.d1{color:var(--r1)} .tag.d2{color:var(--r2)} .tag.d3{color:var(--r3)}
.tag.due.today{background:var(--mint);color:var(--mint-ink)} .tag.due.soon{background:color-mix(in srgb,var(--r2) 18%,var(--surface-2));color:var(--r2)} .tag.due.late{background:#FF3B30;color:#fff} .tag.due.later{color:var(--muted)}
.tag.dl{color:#B23030;background:color-mix(in srgb,#FF3B30 14%,var(--surface-2))} .tag.dl.late{background:#FF3B30;color:#fff}
.go{flex:0 0 auto;border:0;cursor:pointer;background:var(--mint);color:var(--mint-ink);font-weight:900;font-size:13px;border-radius:14px;padding:9px 11px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.go:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.14)}
.task.done{opacity:.62;box-shadow:none}
.task.done .t-title{text-decoration:line-through}
.task.done .go{background:var(--surface-2);color:var(--muted);box-shadow:none}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;font-weight:900;font-size:16px}
.sec button{border:0;background:none;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;padding:4px}
.empty{background:var(--surface);border-radius:22px;padding:22px 18px;text-align:center;box-shadow:var(--shadow)}
.empty .big{font-size:36px}
.empty p{margin:6px 0 0;color:var(--muted);font-weight:600}
.addline{width:100%;border:2px dashed var(--line);background:transparent;border-radius:16px;padding:12px;font-weight:800;cursor:pointer;color:var(--muted);margin-top:4px}

/* rewards */
.boxes{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.boxes::-webkit-scrollbar{display:none}
.box{flex:0 0 104px;border:0;cursor:pointer;background:var(--surface);border-radius:22px;padding:10px 8px 12px;text-align:center;box-shadow:var(--shadow)}
.box svg{width:66px;height:66px;display:block;margin:0 auto 4px;animation:wiggle 2.8s ease-in-out infinite}
.box b{font-size:11.5px;font-weight:800;color:var(--rc)}
@keyframes wiggle{0%,80%,100%{transform:none}84%{transform:rotate(-6deg)}88%{transform:rotate(6deg)}92%{transform:rotate(-3deg)}}
.boxes-empty{color:var(--muted);font-weight:600;font-size:14px;background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-weight:900;font-size:22px}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ach{background:var(--surface);border-radius:22px;padding:14px 8px 12px;text-align:center;box-shadow:var(--shadow);position:relative}
.ach .ic{font-size:28px;width:58px;height:58px;margin:0 auto 8px;border-radius:18px;display:grid;place-items:center;background:var(--surface-2);transform:rotate(-4deg)}
.ach.on .ic{background:linear-gradient(160deg,#7DFFD4,var(--mint));box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.ach:not(.on) .ic span{filter:grayscale(1);opacity:.4}
.ach .nm{font-weight:800;font-size:12.5px;line-height:1.25;overflow-wrap:anywhere;hyphens:auto}
.ach .ds{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3;font-weight:500}
.ach .rw{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:3px;background:var(--rc);transform:rotate(45deg)}
.ach .pr{height:5px;border-radius:9px;background:var(--surface-2);margin:8px 6px 0;overflow:hidden}
.ach .pr i{display:block;height:100%;background:var(--mint);border-radius:inherit}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(488px,calc(100% - 32px));
  height:70px;background:var(--surface);border-radius:26px;box-shadow:0 14px 40px -14px rgba(16,20,24,.5);display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;z-index:10}
.nav-btn{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--muted);padding:8px}
.nav-btn svg{width:24px;height:24px}
.nav-btn[aria-selected="true"]{color:var(--text)}
.plus{justify-self:center;width:72px;height:72px;margin-top:-34px;border-radius:26px;border:5px solid var(--bg);background:var(--mint);color:var(--mint-ink);cursor:pointer;display:grid;place-items:center;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 10px 24px -8px rgba(44,239,176,.8);transition:border-color .45s}
.plus svg{width:28px;height:28px}
.plus:active{transform:translateY(2px)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);border-radius:30px 30px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);
  transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s linear .34s;z-index:21;max-height:90vh;overflow:auto;visibility:hidden}
.sheet.open{transform:none;visibility:visible;transition-delay:0s}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-weight:900;font-size:22px;margin:0 0 14px;overflow-wrap:anywhere}
.field{width:100%;font:inherit;font-size:16px;font-weight:600;padding:13px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--text);resize:none}
.field:focus{outline:none;border-color:var(--ac)}
.label{font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:transparent;font-weight:700;padding:8px 13px;border-radius:99px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--text);background:var(--text);color:var(--bg)}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diff .opt{border-radius:18px;padding:11px 6px;text-align:center}
.diff .opt b{display:block;font-weight:900}
.diff .opt span{font-size:11.5px;opacity:.75;font-weight:700}
.primary{width:100%;margin-top:22px;border:0;border-radius:18px;padding:17px;font-weight:900;font-size:16px;background:var(--mint);color:var(--mint-ink);cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
.primary:disabled{opacity:.4;cursor:default}
.ghost{width:100%;border:2px dashed var(--line);background:transparent;border-radius:16px;padding:13px;font-weight:800;cursor:pointer}
.tv-desc{color:var(--text);font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 14px;line-height:1.5}
.tv-desc.empty{color:var(--muted);font-style:italic}
.tv-meta{display:grid;gap:6px;background:var(--bg);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.tv-row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.tv-row span{color:var(--muted);font-weight:600}
.tv-row b{font-weight:800;text-align:right}
.tv-row b.late{color:#FF3B30}
.tv-actions{display:grid;gap:10px}
.lockbtn{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted)}
.area-row{display:grid;grid-template-columns:54px 1fr 36px;gap:8px;align-items:center;margin-bottom:6px}
.area-row .field{padding:11px 10px}
.area-row .emo{text-align:center;font-size:20px;padding:8px 4px}
.swatches{display:flex;gap:7px;margin:2px 0 8px 62px;flex-wrap:wrap}
.setrow{margin:0 0 18px 62px}
.setrow .opt{padding:6px 11px;font-size:13px}
.sw{width:26px;height:26px;border-radius:9px;border:3px solid transparent;cursor:pointer;padding:0;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--text)}
.del{border:0;background:transparent;color:var(--muted);width:36px;height:36px;cursor:pointer;display:grid;place-items:center;padding:0}
.del svg{width:16px;height:16px}
.coll-card{background:var(--surface-2);border-radius:22px;padding:10px;margin-bottom:10px}
.coll-card .stage{height:190px}
.coll-card.now{outline:3px solid var(--rc)}
.coll-meta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.coll-meta b{font-weight:900;font-size:15px}
.coll-meta span.lk{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:700}
.coll-meta span.now{margin-left:auto;font-size:12px;font-weight:800;color:var(--rc)}

/* celebration */
.celebrate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,14,18,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .25s;padding:24px}
.celebrate.open{opacity:1;pointer-events:auto}
.cel-card{text-align:center;color:#fff;max-width:330px;transform:scale(.7);transition:transform .5s cubic-bezier(.2,1.5,.4,1)}
.celebrate.open .cel-card{transform:none}
.cel-icon{position:relative;width:200px;height:170px;margin:0 auto 14px;display:grid;place-items:center;font-size:72px}
.cel-icon::before{content:"";position:absolute;inset:-60px;z-index:-1;border-radius:50%;
  background:repeating-conic-gradient(color-mix(in srgb,var(--rc,#2CEFB0) 35%,transparent) 0 9deg,transparent 9deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 22%,transparent 64%);mask:radial-gradient(circle,#000 22%,transparent 64%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cel-icon svg{width:190px;height:auto}
.cel-icon img{width:200px;height:150px;object-fit:cover;border-radius:18px}
.cel-icon.boxmode svg{width:130px}
.cel-icon.shake svg{animation:shake .7s ease-in-out}

  x.fillStyle=gr; x.fillRect(0,0,256,128);
  x.fillStyle='rgba(255,255,255,.8)'; x.fillRect(20,18,50,9); x.fillRect(150,26,70,7); x.fillRect(100,70,40,4);
  x.fillStyle='rgba(25,227,255,.85)'; x.fillRect(90,38,34,6); x.fillStyle='rgba(255,60,172,.75)'; x.fillRect(200,46,34,6);
  const tex=new T3.CanvasTexture(c); tex.mapping=T3.EquirectangularReflectionMapping; tex.encoding=T3.sRGBEncoding;

}

let lastT=0;
function loop3d(now){

  views.forEach(v=>{

    v.group.position.y=RM?0:Math.sin(now/900+v.ph)*.04;
    if(v.pts){ const a=v.pts.geometry.attributes.position; for(let i=1;i<a.array.length;i+=3){ a.array[i]+=dt*.3; if(a.array[i]>2.8) a.array[i]=-.1; } a.needsUpdate=true; }
    v.ring.material.emissiveIntensity=.5+TIER_PAL[v.t].glow*(.7+.3*Math.sin(now/500+v.ph));
    if(v.group.userData.spin && !RM) v.group.userData.spin.forEach(o=>{ o.rotation[o.userData.axis||'y']+=dt*.6; });
    v.renderer.render(v.scene,v.cam);

function disposeViews(root){
  views.forEach(v=>{
    if(root && !root.contains(v.canvas) && document.contains(v.canvas)) return;

const DAY=86400000;

function addDaysKey(k,n){ const d=fromKey(k); d.setDate(d.getDate()+n); return dkey(d); }
function fmtDay(k){ const d=fromKey(k); const t=todayKey(); const sameYear=k.slice(0,4)===t.slice(0,4);
  return d.toLocaleDateString('ru-RU',Object.assign({weekday:'short',day:'numeric',month:'short'},sameYear?{}:{year:'numeric'})).replace(/\./g,''); }
function dueInfo(k){ if(!k) return {label:'Без срока',cls:'later',diff:999};
  const diff=Math.round((fromKey(k)-fromKey(todayKey()))/DAY);
  if(diff<0) return {label:`Просрочено, ${fmtDay(k)}`,cls:'late',diff};
  if(diff===0) return {label:'Сегодня',cls:'today',diff};
  if(diff===1) return {label:'Завтра',cls:'soon',diff};

function nextDue(k,rep){ const t=todayKey(); const d=fromKey(k && k>t ? k : t);

/* ---------- animated background ---------- */
const bgfx=(()=>{
  const cv=$('#bgfx'); if(!cv) return {set(){}};
  const ctx=cv.getContext('2d'); let W=0,H=0,P=[],B=[]; let cur=[44,239,176], tgt=[44,239,176];
  const hex2=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  function resize(){ W=cv.width=Math.round(innerWidth); H=cv.height=Math.round(innerHeight); if(!P.length) seedP(); }
  function seedP(){ P=Array.from({length:42},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.6,vx:(Math.random()-.5)*.12,vy:-.05-Math.random()*.16,a:.25+Math.random()*.5,ph:Math.random()*6.28}));
    B=Array.from({length:3},(_,i)=>({x:Math.random()*W,y:Math.random()*H,r:160+Math.random()*120,vx:(Math.random()-.5)*.08,vy:(Math.random()-.5)*.08,a:.14+i*.03})); }
  window.addEventListener('resize',resize); resize();
  let last=0;
  function frame(now){
    requestAnimationFrame(frame); if(document.hidden) return;
    const dt=Math.min(50,(now-last)||16); last=now;
    for(let i=0;i<3;i++) cur[i]+=(tgt[i]-cur[i])*Math.min(1,dt/600);
    const c=cur.map(v=>Math.round(v)).join(','); const dark=isDark();
    ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation=dark?'lighter':'source-over';
    B.forEach(b=>{ if(!RM){ b.x+=b.vx*dt*.06; b.y+=b.vy*dt*.06; if(b.x<-b.r) b.x=W+b.r; if(b.x>W+b.r) b.x=-b.r; if(b.y<-b.r) b.y=H+b.r; if(b.y>H+b.r) b.y=-b.r; }
      const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r); g.addColorStop(0,`rgba(${c},${dark?b.a*.9:b.a*1.3})`); g.addColorStop(1,`rgba(${c},0)`); ctx.fillStyle=g; ctx.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2); });
    P.forEach(p=>{ if(!RM){ p.x+=p.vx*dt*.06+Math.sin(now/1800+p.ph)*.08; p.y+=p.vy*dt*.06; if(p.y<-10){ p.y=H+10; p.x=Math.random()*W; } if(p.x<-10) p.x=W+10; if(p.x>W+10) p.x=-10; }
      const tw=.6+.4*Math.sin(now/900+p.ph); ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fillStyle=`rgba(${c},${(p.a*tw*(dark?.9:.8)).toFixed(3)})`; ctx.fill();
      if(p.r>2.4){ const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4); g.addColorStop(0,`rgba(${c},${(p.a*tw*.35).toFixed(3)})`); g.addColorStop(1,`rgba(${c},0)`); ctx.fillStyle=g; ctx.fillRect(p.x-p.r*4,p.y-p.r*4,p.r*8,p.r*8); } });
  }
  requestAnimationFrame(frame);
  return { set(hex){ tgt=hex2(hex); } };
})();

const queue=[]; let showing=false;

function confetti(){
  if(RM) return;
  const cv=$('#confetti'), ctx=cv.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#2CEFB0','#FFD23F','#3D9BFF','#A35CFF','#FF9F1C','#FF5D8F'];
  const P=Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight*.38,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,
    s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  const st=performance.now();
  (function tick(now){ const el=now-st; ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{ p.vy+=.42; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha=Math.max(0,1-el/1900); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(el<1900) requestAnimationFrame(tick); else ctx.clearRect(0,0,innerWidth,innerHeight); })(st);
}


/* ---------- 3D thumbnails (shared offscreen renderer) ---------- */
const TKEY='tempo_thumbs_v1'; let thumbs = {}; try{ thumbs = JSON.parse(localStorage.getItem(TKEY)||'{}')||{}; }catch(e){ thumbs={}; } const thumbQ = []; let thumbBusy=false, thumbR=null, thumbScene=null, thumbCam=null, thumbEnv=null;
function thumbSrc(set,tier){ const k=set+':'+tier; if(thumbs[k]) return thumbs[k]; if(T3 && !thumbQ.includes(k)){ thumbQ.push(k); pumpThumbs(); } return null; }
function pumpThumbs(){
  if(thumbBusy || !thumbQ.length) return; thumbBusy=true;
  const run=()=>{ const k=thumbQ.shift(); if(!k){ thumbBusy=false; return; }
    try{ thumbs[k]=renderThumb(k); }catch(e){ console.error(e); thumbs[k]=''; }
    document.querySelectorAll(`img[data-th="${k}"]`).forEach(im=>{ if(thumbs[k]) im.src=thumbs[k]; });
    if(thumbQ.length) setTimeout(run,0); else { thumbBusy=false; try{ localStorage.setItem(TKEY,JSON.stringify(thumbs)); }catch(e){} } };
  setTimeout(run,0);
}
function flushThumbs(){ document.querySelectorAll('img[data-th]:not([src])').forEach(im=>{ const s=thumbSrc(...im.dataset.th.split(':')); if(s) im.src=s; }); }
function renderThumb(k){
  const [set,ts]=k.split(':'), t=+ts, P=TIER_PAL[t];
  if(!thumbR){ const c=document.createElement('canvas'); c.width=240; c.height=180; thumbR=new T3.WebGLRenderer({canvas:c,antialias:true,alpha:true,preserveDrawingBuffer:true}); thumbR.setSize(240,180,false); thumbR.outputEncoding=T3.sRGBEncoding; thumbR.toneMapping=T3.ACESFilmicToneMapping; try{ thumbEnv=makeEnv(thumbR); }catch(e){}
    thumbCam=new T3.PerspectiveCamera(30,240/180,.1,50); thumbCam.position.set(0,2.2,6.0); thumbCam.lookAt(0,.75,0); }
  const scene=new T3.Scene(); if(thumbEnv) scene.environment=thumbEnv;
  scene.add(new T3.AmbientLight(0xffffff,.35)); const key=new T3.DirectionalLight(0xffffff,.9); key.position.set(3,6,4); scene.add(key);
  const l1=new T3.PointLight(P.acc2,.6+P.glow,14); l1.position.set(-3,2.5,2.5); scene.add(l1); const l2=new T3.PointLight(P.acc,.6+P.glow,14); l2.position.set(3,1.5,-2); scene.add(l2);
  const disc=new T3.Mesh(new T3.CircleGeometry(1.6,32),new T3.MeshStandardMaterial({color:P.acc,emissive:P.acc,emissiveIntensity:.3+.3*t,transparent:true,opacity:.22+.06*t})); disc.rotation.x=-Math.PI/2; scene.add(disc);
  const ring=mesh(scene,new T3.TorusGeometry(1.6,.04,8,48),M(P.acc,{emissive:P.acc,emissiveIntensity:.8})); ring.rotation.x=Math.PI/2;
  const group=new T3.Group(); scene.add(group); (BUILD[set]||BUILD.gem)(group,t,P); group.rotation.y=.35;
  thumbR.render(scene,thumbCam);
  const url=thumbR.domElement.toDataURL('image/png');
  scene.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose()); } });
  return url;
}

/* ---------- events ---------- */
function bind(){
  $('#navHome').addEventListener('click',()=>goPage(0));
  $('#navAch').addEventListener('click',()=>goPage(pageCount()-1));
  $('#plus').addEventListener('click',()=>openTask(null,currentAreaId()));
  $('#openAreas').addEventListener('click',openAreas);
  $('#scrim').addEventListener('click',hideSheet);
  $('#celBtn').addEventListener('click',closeCel);
  if(inTG&&ver('6.1')){ try{ tg.BackButton.onClick(()=>{ if($('#cel').classList.contains('open')) closeCel(); else hideSheet(); }); }catch(e){} }
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#cel').classList.contains('open')) closeCel(); else hideSheet(); } });

  pagesEl.addEventListener('click',e=>{
    const go=e.target.closest('.go'); if(go){ const t=S.tasks.find(x=>x.id===go.closest('.task').dataset.id); if(t) (t.done?undo:complete)(t,go); return; }
    const tb=e.target.closest('.t-body'); if(tb){ openTask(tb.closest('.task').dataset.id); return; }
    const add=e.target.closest('[data-add]'); if(add){ openTask(null,add.dataset.add); return; }
    const tg2=e.target.closest('[data-toggle]'); if(tg2){ const id=tg2.dataset.toggle; ui.showDone[id]=!ui.showDone[id]; updateArea(id); return; }
    const ov=e.target.closest('[data-go]'); if(ov){ goPage(+ov.dataset.go); haptic('select'); return; }
    const box=e.target.closest('[data-box]'); if(box){ openBox(box.dataset.box); return; }
    const stg=e.target.closest('.stage'); if(stg){ const sec=stg.closest('[data-area]'); const a=sec&&S.areas.find(x=>x.id===sec.dataset.area); if(a) openCollection(a.set||'gem',a); return; }
  });
  pagesEl.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.classList.contains('t-body')) openTask(e.target.closest('.task').dataset.id); });

  $('#unlockBtn').addEventListener('click',()=>{ $('#taskView').style.display='none'; $('#taskForm').style.display=''; haptic('impact','light'); setTimeout(()=>$('#taskInput').focus(),100); });
  $('#tvDone').addEventListener('click',()=>{ const t=S.tasks.find(x=>x.id===ui.editId); if(!t||t.done) return; hideSheet(); const i=areaIndex(t.a); if(i>=0 && ui.page!==i+1) goPage(i+1); setTimeout(()=>{ const row=pagesEl.querySelector(`.task[data-id="${t.id}"] .go`); complete(t,row||null); },350); });
  $('#taskInput').addEventListener('input',e=>{ $('#addBtn').disabled=!e.target.value.trim(); });
  $('#taskInput').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('#descInput').focus(); } });
  $('#addBtn').addEventListener('click',saveTask);
  $('#areaOpts').addEventListener('click',e=>{ const c=e.target.closest('[data-area]'); if(!c) return; ui.newArea=c.dataset.area; renderFormOpts(); haptic('select'); });
  $('#diffOpts').addEventListener('click',e=>{ const c=e.target.closest('[data-diff]'); if(!c) return; ui.newDiff=+c.dataset.diff; renderFormOpts(); haptic('select'); });
  $('#dueOpts').addEventListener('click',e=>{ const c=e.target.closest('[data-due]'); if(!c) return; if(c.dataset.due==='custom'){ try{ $('#dueInput').showPicker(); }catch(err){ $('#dueInput').focus(); } return; } ui.newDue=c.dataset.due; renderFormOpts(); haptic('select'); });
  $('#dueInput').addEventListener('change',e=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){ ui.newDue=e.target.value; renderFormOpts(); } });
  $('#dlOpts').addEventListener('click',e=>{ const c=e.target.closest('[data-dl]'); if(!c) return; if(c.dataset.dl==='custom'){ try{ $('#dlInput').showPicker(); }catch(err){ $('#dlInput').focus(); } return; } ui.newDl=c.dataset.dl; renderFormOpts(); haptic('select'); });
  $('#dlInput').addEventListener('change',e=>{ ui.newDl=/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)?e.target.value:''; renderFormOpts(); });
  $('#repOpts').addEventListener('click',e=>{ const c=e.target.closest('[data-rep]'); if(!c) return; ui.newRep=c.dataset.rep; renderFormOpts(); haptic('select'); });
  $('#delTaskBtn').addEventListener('click',async()=>{ const id=ui.editId; if(!id) return; const t=S.tasks.find(x=>x.id===id); if(!(await askConfirm(`Удалить задачу «${t.t}»?`))) return; S.tasks=S.tasks.filter(x=>x.id!==id); ui.editId=null; save(); hideSheet(); updateArea(t.a); updateHome(); });

  $('#areasList').addEventListener('input',e=>{ const inp=e.target.closest('[data-f]'); if(!inp) return; const a=S.areas.find(x=>x.id===inp.closest('.area-row').dataset.area); if(!a) return; const v=inp.value.trim(); if(inp.dataset.f==='name') a.name=v||'Без названия'; else a.emoji=v||'✨'; save(); });
  $('#areasList').addEventListener('click',async e=>{
    const st=e.target.closest('[data-set]'); if(st){ const a=S.areas.find(x=>x.id===st.closest('.setrow').dataset.area); a.set=st.dataset.set; renderAreasList(); save(); buildPages(); haptic('select'); return; }
    const sw=e.target.closest('[data-color]'); if(sw){ const a=S.areas.find(x=>x.id===sw.closest('.swatches').dataset.area); a.color=sw.dataset.color; renderAreasList(); save(); applyPageTheme(); renderDots(); haptic('select'); return; }
    const d=e.target.closest('[data-del]');
    if(d && S.areas.length>1){ const a=S.areas.find(x=>x.id===d.dataset.del); if(!(await askConfirm(`Удалить «${a.name}»? Задачи этой области и её опыт тоже удалятся.`))) return;
      S.areas=S.areas.filter(x=>x.id!==a.id); S.tasks=S.tasks.filter(t=>t.a!==a.id); Object.values(S.days).forEach(dd=>{ if(dd.a) dd.a=dd.a.filter(x=>x!==a.id); }); renderAreasList(); save(); ui.page=0; buildPages(); }
  });
  $('#addArea').addEventListener('click',()=>{ const used=new Set(S.areas.map(a=>a.color)); const color=COLORS.find(c=>!used.has(c))||COLORS[S.areas.length%COLORS.length]; const usedSets=new Set(S.areas.map(a=>a.set)); const set=Object.keys(SETS).find(k=>!usedSets.has(k))||'gem';
    S.areas.push({id:uid(),name:'Новая область',emoji:'✨',color,set,xp:0}); S.stats.areasCreated++; renderAreasList(); save(); buildPages(); const rows=document.querySelectorAll('#areasList input[data-f="name"]'); const last=rows[rows.length-1]; if(last){ last.focus(); last.select(); } });
  $('#openColl').addEventListener('click',()=>{ hideSheet(); const a=S.areas[Math.max(0,ui.page-1)]; setTimeout(()=>openCollection(a?a.set:'run',a),380); });
  $('#areasDone').addEventListener('click',()=>{ hideSheet(); checkAch(); save(); buildPages(); });
  $('#collSets').addEventListener('click',e=>{ const c=e.target.closest('[data-cset]'); if(!c) return; collSet=c.dataset.cset; const a=S.areas.find(x=>(x.set||'gem')===collSet); renderCollection(a); mount3D($('#collSheet')); haptic('select'); });
}

/* ---------- init ---------- */
async function init(){
  if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} try{ if(ver('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }catch(e){} }
  applyTheme(); if(inTG && tg.onEvent) tg.onEvent('themeChanged',()=>{ applyTheme(); applyPageTheme(); });
  S = (await load()) || seed();
  bind(); buildPages();
  window.__tempo={get S(){ return S; }, thumbSrc, renderThumb};
}
init();
})();
</script>
